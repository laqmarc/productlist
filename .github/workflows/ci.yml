name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: none

      - name: PHP syntax check
        run: |
          set -e
          find . -name '*.php' -not -path './build/*' -print0 \
            | while IFS= read -r -d '' file; do php -l "$file"; done

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: JS syntax check
        run: |
          set -e
          node --check views/js/productlist.js
          node --check views/js/productlist-admin.js

      - name: Validate distributable ZIP is POSIX-compliant
        run: |
          python3 - <<'PY'
          import zipfile
          names = zipfile.ZipFile('build/productlist.zip').namelist()
          assert any(n == 'productlist/productlist.php' for n in names), 'missing productlist.php in zip'
          bad = [n for n in names if '\\' in n]
          assert not bad, f'backslash path separators in zip entries: {bad[:3]}'
          print(f'zip ok: {len(names)} entries, POSIX paths')
          PY
